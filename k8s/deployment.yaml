apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accounts-api
  template:
    metadata:
      labels:
        app: accounts-api
    spec:
      serviceAccountName: accounts-api
      containers:
        - name: accounts-api
          image: ACCOUNTS_API_IMAGE
          ports:
            - containerPort: 8000
          env:
            - name: DATA_BUCKET
              value: brahma-demo-data-ACCOUNT_ID
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
