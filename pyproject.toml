[project]
name = "accounts-api"
version = "0.1.0"
description = "Customer accounts service"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "boto3>=1.35,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "httpx>=0.28,<1", "schemathesis>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
